version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: intentguard-postgres
    restart: always
    environment:
      POSTGRES_USER: intentguard
      POSTGRES_PASSWORD: intentguard_secure_pw
      POSTGRES_DB: intentguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentguard -d intentguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intentguard-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: intentguard-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://intentguard:intentguard_secure_pw@db:5432/intentguard_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: sandbox
      SECRET_KEY: intentguard-enterprise-production-signing-secret-key-32bytesmin
      SANDBOX_PAYMENT_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intentguard-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
      - "3000:80"

volumes:
  postgres_data:
